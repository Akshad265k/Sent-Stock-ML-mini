name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'index.html'

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: mpd-frontend-209757840945
  CLOUDFRONT_DIST_ID: E3FOMHOPSEVE4Y

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Fetch API URL from Parameter Store
      run: |
        API_URL=$(aws ssm get-parameter --name "/mpd/frontend/VITE_API_BASE_URL" --query "Parameter.Value" --output text)
        echo "VITE_API_BASE_URL=$API_URL" > .env.production

    - name: Build Frontend
      run: npm run build
      env:
        CI: false

    - name: Sync Dist to S3
      run: |
        aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} --paths "/*"
